<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1519">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>車中泊さがし</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --ink:#0B1519; --surface:#12232A; --surface-2:#193138; --line:#24424B;
  --amber:#F4B740; --amber-dim:rgba(244,183,64,.13);
  --moon:#7FD4C8; --text:#EAF1EE; --muted:#85A19B;
  --warn:#E8925A; --warn-dim:rgba(232,146,90,.14);
  --live:#9E8CFF; --live-dim:rgba(158,140,255,.15);
  --mine:#78D98E; --mine-dim:rgba(120,217,142,.15);
  --jp:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --num:"Space Grotesk",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink); color:var(--text); font-family:var(--jp);
  -webkit-font-smoothing:antialiased; overflow:hidden; display:flex; flex-direction:column; height:100dvh;}
button{font-family:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px; border-radius:6px}

header{padding:calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom:1px solid var(--line);
  background:var(--ink); display:flex; align-items:center; gap:12px; flex:0 0 auto;}
.mark{display:flex; align-items:baseline; gap:8px}
.mark b{font-weight:700; font-size:17px; letter-spacing:.02em}
.mark .lamp{width:9px; height:9px; border-radius:50%; background:var(--amber); box-shadow:0 0 10px 1px var(--amber); align-self:center}
.status{margin-left:auto; text-align:right; font-size:11.5px; color:var(--muted); line-height:1.35}
.status .src{color:var(--moon); font-family:var(--num); font-weight:500}

#mapwrap{position:relative; flex:0 0 auto; height:54dvh; transition:height .22s ease}
body.bigmap #mapwrap{height:74dvh}
#map{position:absolute; inset:0; background:var(--surface); z-index:0}
.leaflet-container{background:#0d1c22; font-family:var(--jp)}
.leaflet-control-attribution{background:rgba(11,21,25,.7)!important; color:#6f8b86!important}
.leaflet-control-attribution a{color:#8fb0aa!important}
.leaflet-bar a{background:var(--surface-2)!important; color:var(--text)!important; border-color:var(--line)!important}
#mapwrap.adding{cursor:crosshair}
#mapwrap.adding #map{box-shadow:inset 0 0 0 2px var(--mine)}

.mapctl{position:absolute; z-index:600; background:rgba(18,35,42,.94); border:1px solid var(--line); color:var(--text);
  border-radius:10px; font-size:12px; font-weight:700; padding:8px 11px; box-shadow:0 4px 14px rgba(0,0,0,.35);
  display:flex; align-items:center; gap:7px}
.mapctl svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
#liveMapBtn{left:50%; transform:translateX(-50%); bottom:10px; border-color:var(--live); color:#c3b8ff; background:rgba(25,22,48,.94)}
#liveMapBtn:disabled{opacity:.6}
#liveMapBtn.on svg{animation:spin 1s linear infinite}
#expandBtn{top:10px; right:10px; padding:8px}
#legendBtn{bottom:10px; left:10px; padding:8px 10px; color:var(--muted); font-weight:500}
.legend{position:absolute; left:10px; bottom:46px; z-index:650; background:rgba(11,21,25,.96); border:1px solid var(--line);
  border-radius:12px; padding:11px 14px; display:none; font-size:11.5px; color:var(--muted); line-height:2; max-width:min(78vw,300px)}
.legend.show{display:block}
.legend .sw{display:inline-block; width:10px; height:10px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); margin-right:8px}
.legend .lnote{line-height:1.6; margin-top:6px; border-top:1px solid var(--line); padding-top:8px}

.banner{position:absolute; top:10px; left:10px; right:10px; z-index:700; background:rgba(18,35,42,.96);
  border:1px solid var(--mine); border-radius:12px; padding:10px 12px; display:none; align-items:center; gap:10px;
  box-shadow:0 6px 20px rgba(0,0,0,.4)}
.banner.show{display:flex}
.banner .txt{flex:1; font-size:12.5px; line-height:1.4; color:var(--text)}
.banner .txt b{color:var(--mine)}
.banner button{border:1px solid var(--line); background:var(--surface-2); color:var(--text);
  border-radius:8px; padding:7px 10px; font-size:12px; font-weight:700; white-space:nowrap}
.banner button.pri{background:var(--mine-dim); border-color:var(--mine); color:#bff0cb}

.pin{width:14px; height:14px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); border:1.5px solid rgba(0,0,0,.35)}
.pin.rv{background:var(--moon)} .pin.michi{background:#9ec7ff}
.pin.free{background:#a9d98a} .pin.chk{background:var(--warn)} .pin.live{background:var(--live)} .pin.my{background:var(--mine)}
.pin.sel{transform:rotate(-45deg) scale(1.5); box-shadow:0 0 0 5px rgba(234,241,238,.22), 0 0 12px 2px rgba(244,183,64,.5)}
.pin.near{background:var(--amber); animation:beat 1.8s ease-in-out infinite}
@keyframes beat{0%,100%{box-shadow:0 0 0 4px var(--amber-dim),0 0 10px 1px rgba(244,183,64,.45)}
  50%{box-shadow:0 0 0 8px rgba(244,183,64,.05),0 0 16px 3px rgba(244,183,64,.75)}}
.pin.temp{background:var(--mine); width:18px;height:18px; box-shadow:0 0 0 6px var(--mine-dim)}
.me{width:16px;height:16px;border-radius:50%;background:#5ab7ff;border:2px solid #eaf6ff;box-shadow:0 0 0 6px rgba(90,183,255,.18)}
.base{width:18px;height:18px;border-radius:50%;background:transparent;border:2px dashed var(--amber);box-shadow:0 0 0 5px var(--amber-dim)}

.filters{position:absolute; top:10px; left:56px; right:52px; z-index:600; display:flex; gap:8px;
  overflow-x:auto; scrollbar-width:none; padding:2px}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:7px 13px; background:rgba(18,35,42,.92);
  border:1px solid var(--line); color:var(--muted); border-radius:999px; font-size:13px; font-weight:500; transition:.15s;
  box-shadow:0 3px 12px rgba(0,0,0,.35)}
.chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.chip[aria-pressed="true"]{background:rgba(46,37,12,.95); border-color:var(--amber); color:var(--amber)}
.chip .cnt{font-family:var(--num); font-size:11px; opacity:.7}

.list{flex:1 1 auto; overflow-y:auto; padding:12px 12px calc(150px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch}
.hint{color:var(--muted); font-size:13px; text-align:center; padding:30px 24px; line-height:1.7}
.hint b{color:var(--amber); font-weight:500}
.bandhead{font-size:11px; color:var(--muted); letter-spacing:.08em; margin:16px 6px 9px; display:flex; align-items:center; gap:10px; font-family:var(--num)}
.bandhead:first-child{margin-top:2px}
.bandhead::after{content:''; flex:1; height:1px; background:var(--line)}
.notice{font-size:11.5px; color:var(--muted); background:var(--surface); border:1px dashed var(--line); border-radius:10px;
  padding:8px 12px; margin-bottom:10px; line-height:1.6}

.card{display:flex; gap:14px; align-items:stretch; width:100%; text-align:left; background:var(--surface);
  border:1px solid var(--line); border-radius:14px; padding:13px 14px; margin-bottom:9px; color:var(--text); transition:.14s}
.card:hover,.card:active{background:var(--surface-2); border-color:#2f5560}
.card.live{border-style:dashed; border-color:#3a3560}
.card.my{border-color:#2f5a3e}
.dist{flex:0 0 auto; width:66px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; border-right:1px solid var(--line); padding-right:12px}
.dist .v{font-family:var(--num); font-weight:600; font-size:23px; color:var(--moon); line-height:1; letter-spacing:-.01em; font-variant-numeric:tabular-nums}
.dist .u{font-family:var(--num); font-size:11px; color:var(--muted); margin-top:3px; letter-spacing:.04em}
.dist .u.dir{color:var(--moon); opacity:.6}
.arw{display:inline-block; margin-right:2px; font-size:10px}
.body{flex:1 1 auto; min-width:0}
.name{font-weight:700; font-size:15.5px; line-height:1.3; margin:1px 0 3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.meta{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.tag{font-size:11px; padding:1px 7px; border-radius:5px; background:var(--surface-2); color:#a9c6c0}
.tag.chk{background:var(--warn-dim); color:var(--warn); font-weight:500}
.tag.cand{background:var(--amber-dim); color:var(--amber)}
.tag.live{background:var(--live-dim); color:#c3b8ff; font-weight:500}
.tag.my{background:var(--mine-dim); color:#bff0cb; font-weight:500}
.amen{display:flex; align-items:center; gap:11px; margin-top:9px}
.amen .i{display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--muted)}
.amen .i.on{color:var(--text)}
.amen svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}
.amen .i.on svg{stroke:var(--amber)}
.quiet{display:flex; align-items:center; gap:5px; margin-left:auto; font-size:11px; color:var(--muted)}
.dots{display:flex; gap:3px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line)} .dot.f{background:var(--moon)}
.livemeta{margin-top:8px; font-size:11.5px; color:var(--muted)}
.myfoot{margin:14px 4px 4px; text-align:center; font-size:12px; color:var(--muted)}
.myfoot b{color:var(--mine); font-family:var(--num)}
.linkbtn{background:none; border:none; color:var(--moon); font-size:12px; text-decoration:underline; padding:4px}

.scrim{position:fixed; inset:0; background:rgba(4,10,12,.62); opacity:0; pointer-events:none; transition:.22s; z-index:900; backdrop-filter:blur(2px)}
.scrim.open{opacity:1; pointer-events:auto}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:901; background:var(--surface); border-top:1px solid var(--line);
  border-radius:20px 20px 0 0; padding:8px 20px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(101%); transition:transform .26s cubic-bezier(.22,1,.36,1); max-height:86dvh; overflow-y:auto; overscroll-behavior:contain}
.sheet.open{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 14px}
.s-top{display:flex; align-items:flex-start; gap:12px}
.s-name{font-size:19px; font-weight:700; line-height:1.3; flex:1}
.s-close{flex:0 0 auto; width:34px;height:34px;border-radius:50%; background:var(--surface-2); border:1px solid var(--line); color:var(--muted); font-size:17px; line-height:1}
.s-dist{display:flex; align-items:baseline; gap:6px; margin:12px 0 2px}
.s-dist .v{font-family:var(--num); font-size:30px; font-weight:600; color:var(--moon); letter-spacing:-.01em}
.s-dist .u{font-family:var(--num); font-size:13px; color:var(--muted)}
.s-dist .sep{color:var(--line)} .s-dist .cat{font-size:13px; color:var(--muted); font-weight:400}
.s-amen{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin:14px 0 4px}
.s-amen .i{display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--muted)}
.s-amen .i.on{color:var(--text)}
.s-amen svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7; flex:0 0 auto}
.s-amen .i.on svg{stroke:var(--amber)}
.s-quiet{display:flex; align-items:center; gap:9px; margin:16px 0 6px; font-size:13.5px; color:var(--text)}
.note{border-radius:11px; padding:11px 13px; font-size:12.5px; line-height:1.6; margin:14px 0}
.note.warn{background:var(--warn-dim); border:1px solid rgba(232,146,90,.3); color:#f0b58f}
.note.cand{background:var(--amber-dim); border:1px solid rgba(244,183,64,.3); color:#f0d296}
.note.live{background:var(--live-dim); border:1px solid rgba(158,140,255,.3); color:#cbc2ff}
.memo{color:#c9dbd6; font-size:14px; line-height:1.85; margin:16px 0 4px}
.actions{display:flex; gap:10px; margin-top:18px}
.btn{flex:1; display:flex; align-items:center; justify-content:center; gap:8px; padding:14px; border-radius:12px; font-size:14.5px; font-weight:700; border:1px solid var(--line); text-decoration:none}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.btn.go{background:var(--amber); color:#20160a; border-color:var(--amber)}
.btn.map{background:var(--surface-2); color:var(--text)}
.btn.sm{padding:11px; font-size:13.5px; font-weight:700}
.btn.edit{background:var(--surface-2); color:#bff0cb; border-color:#2f5a3e}
.btn.del{background:var(--surface-2); color:#e88; border-color:#5a2f2f}

/* form */
.field{margin:14px 0}
.field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:500}
.field input[type=text], .field textarea{width:100%; background:var(--ink); border:1px solid var(--line); color:var(--text);
  border-radius:10px; padding:11px 12px; font-family:inherit; font-size:14px}
.field textarea{min-height:74px; resize:vertical; line-height:1.6}
.toggles{display:flex; gap:8px; flex-wrap:wrap}
.tg{display:flex; align-items:center; gap:6px; padding:8px 12px; background:var(--ink); border:1px solid var(--line); color:var(--muted); border-radius:999px; font-size:13px; font-weight:500}
.tg[aria-pressed="true"]{background:var(--amber-dim); border-color:var(--amber); color:var(--amber)}
.qsel{display:flex; gap:8px}
.qbtn{flex:1; padding:9px; background:var(--ink); border:1px solid var(--line); color:var(--muted); border-radius:10px; font-size:13px; font-weight:600}
.qbtn[aria-pressed="true"]{background:var(--moon); color:#08201c; border-color:var(--moon)}
.poshint{font-size:11.5px; color:var(--muted); margin-top:6px}

.fabs{position:fixed; right:16px; z-index:800; bottom:calc(16px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px}
.fab{width:52px;height:52px;border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(0,0,0,.4)}
.fab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2}
.fab.locate{background:var(--surface-2); color:var(--moon)}
.fab.locate.on{border-color:var(--moon); box-shadow:0 0 0 2px rgba(127,212,200,.3), 0 8px 24px rgba(0,0,0,.4)}
.fab.add{background:var(--mine); color:#08210f; border-color:var(--mine)}
.fab.locate.loading svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px);
  background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:10px 16px; border-radius:10px;
  font-size:13px; z-index:950; opacity:0; pointer-events:none; transition:.25s; box-shadow:0 8px 24px rgba(0,0,0,.4); max-width:88vw; text-align:center; line-height:1.5}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="mark"><span class="lamp"></span><b>車中泊さがし</b></div>
  <div class="status"><div id="statusMain">現在地を取得中…</div><div class="src" id="statusSrc"></div></div>
</header>

<div id="mapwrap">
  <div id="map"></div>
  <div class="filters" id="filters">
    <button class="chip" data-f="wc" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M6 3v18M18 3v18M6 8h12"/><circle cx="6" cy="5.5" r="1.4"/><circle cx="18" cy="5.5" r="1.4"/></svg>トイレ<span class="cnt"></span></button>
    <button class="chip" data-f="h24" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>24時間<span class="cnt"></span></button>
    <button class="chip" data-f="free" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M6 4l6 7 6-7M12 11v9M8 15h8M8 18h8"/></svg>無料<span class="cnt"></span></button>
    <button class="chip" data-f="onsen" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 14c-1 1.5-1 3 0 4M12 13c-1 1.7-1 3.3 0 5M16 14c-1 1.5-1 3 0 4M4 21h16"/></svg>温泉近く<span class="cnt"></span></button>
    <button class="chip" data-f="quiet" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 14h4l5 5V5L8 10H4zM17 9c1.5 1.5 1.5 4.5 0 6"/></svg>静か<span class="cnt"></span></button>
  </div>
  <button class="mapctl" id="expandBtn" aria-label="地図を拡大/縮小" title="地図の大きさを切り替え"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
  <button class="mapctl" id="legendBtn" aria-expanded="false">凡例</button>
  <div class="legend" id="legend">
    <div><span class="sw" style="background:#9ec7ff"></span>道の駅</div>
    <div><span class="sw" style="background:var(--moon)"></span>RVパーク・キャンプ場</div>
    <div><span class="sw" style="background:var(--warn)"></span>要確認（本来は宿泊地でない等）</div>
    <div><span class="sw" style="background:var(--mine)"></span>自分で追加したスポット</div>
    <div><span class="sw" style="background:var(--live)"></span>OSM候補（ライブ検索・未確認）</div>
    <div class="lnote">「このあたりを検索」は、表示中の地図の範囲（3〜30km）からOSMの候補を探します。地図をタップするとその地点が基準点になります。</div>
  </div>
  <button class="mapctl" id="liveMapBtn" title="表示中の地図範囲からOSMの候補を探します（要通信・未確認）">
    <svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 0114 0M2 12a10 10 0 0120 0M8.5 12a3.5 3.5 0 017 0"/><circle cx="12" cy="12" r="1"/></svg>このあたりを検索
  </button>
  <div class="banner" id="banner">
    <div class="txt" id="bannerTxt"><b>追加する場所</b>を地図でタップ</div>
    <button class="pri" id="bnCurrent">現在地を使う</button>
    <button id="bnCancel">やめる</button>
  </div>
</div>

<div class="list" id="list"></div>

<div class="fabs">
  <button class="fab add" id="addFab" aria-label="スポットを追加"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="fab locate" id="fab" aria-label="現在地に移動 / 追尾の切り替え"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</div>

<div class="toast" id="toast"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="スポット詳細"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="sheet" id="formSheet" role="dialog" aria-modal="true" aria-label="スポットを追加"><div class="grab"></div><div id="formBody"></div></div>
<div class="sheet" id="dataSheet" role="dialog" aria-modal="true" aria-label="データ"><div class="grab"></div><div id="dataBody"></div></div>

/* ---------- storage ---------- */
const MYKEY='carcamp_myspots_v1', STKEY='carcamp_state_v1', LVKEY='carcamp_live_v1';
function loadJSON(k,fb){try{const v=JSON.parse(localStorage.getItem(k)); return v==null?fb:v;}catch(e){return fb;}}
function saveJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){toast('保存できませんでした');}}
let MY=loadJSON(MYKEY,[]);
function saveMy(){saveJSON(MYKEY,MY);}
let LIVE=[], liveTs=null, liveRestored=false;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const IC={
  wc:'<svg viewBox="0 0 24 24"><path d="M6 3v18M18 3v18M6 8h12"/><circle cx="6" cy="5.5" r="1.4"/><circle cx="18" cy="5.5" r="1.4"/></svg>',
  h24:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  free:'<svg viewBox="0 0 24 24"><path d="M6 4l6 7 6-7M12 11v9M8 15h8M8 18h8"/></svg>',
  onsen:'<svg viewBox="0 0 24 24"><path d="M8 14c-1 1.5-1 3 0 4M12 13c-1 1.7-1 3.3 0 5M16 14c-1 1.5-1 3 0 4M4 21h16"/></svg>',
};
const LABELS={wc:'トイレ',h24:'24時間',free:'無料',onsen:'温泉近く',quiet:'静か'};

/* ---------- state ---------- */
const ST=loadJSON(STKEY,{});
let base=null, baseSrc=null;
let filters={wc:false,h24:false,free:false,onsen:false,quiet:false};
if(ST.filters) for(const k of Object.keys(filters)){ if(typeof ST.filters[k]==='boolean') filters[k]=ST.filters[k]; }
let markers=new Map();           // id -> Leaflet marker（マップ全体で共通管理）
let baseMarker=null, accCircle=null, tempMarker=null;
let addMode=false, editing=null, selId=null;
let watchId=null, lastGps=null, firstFix=false;

function saveState(){saveJSON(STKEY,{filters, base, baseSrc, bigmap:document.body.classList.contains('bigmap')});}

if(ST.bigmap) document.body.classList.add('bigmap');   // 地図生成前に適用（サイズ計測のずれ防止）
const map=L.map('map',{zoomControl:true,attributionControl:true}).setView([36.4,138.2],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);

function pinClass(s){
  if(s.t===3) return 'my'; if(s.t===2) return 'live';
  if(s.chk) return 'chk';
  if(s.cat.includes('RVパーク')) return 'rv';
  if(s.cat.includes('道の駅')) return 'michi';
  if(s.free) return 'free'; return 'rv';
}
function mkIcon(cls){return L.divIcon({className:'',html:`<div class="pin ${cls}"></div>`,iconSize:[14,14],iconAnchor:[7,13]});}
function addMarkerFor(id,s){
  const cls=pinClass(s);
  const m=L.marker([s.lat,s.lng],{icon:mkIcon(cls)}).addTo(map);
  m._cls=cls;
  m.on('click',e=>{L.DomEvent.stop(e); openSheet(id);});
  markers.set(id,m);
}
SPOTS.forEach((s,i)=>addMarkerFor('s'+i,s));
function redrawMy(){
  [...markers.keys()].filter(k=>k[0]==='m').forEach(k=>{map.removeLayer(markers.get(k)); markers.delete(k);});
  MY.forEach(s=>addMarkerFor('m'+s.id,s));
}
function drawLive(){
  [...markers.keys()].filter(k=>k[0]==='l').forEach(k=>{map.removeLayer(markers.get(k)); markers.delete(k);});
  LIVE.forEach((s,i)=>addMarkerFor('l'+i,s));
}
redrawMy();

function iconCls(id,m){ return m._cls+(id===nearId?' near':'')+(id===selId?' sel':''); }
function selectMarker(id){
  clearSel();
  const m=markers.get(id); if(!m) return;
  selId=id; m.setIcon(mkIcon(iconCls(id,m))); m.setZIndexOffset(1000);
  map.panTo(m.getLatLng());
}
function clearSel(){
  if(selId==null) return;
  const m=markers.get(selId), id=selId; selId=null;
  if(m){m.setIcon(mkIcon(iconCls(id,m))); m.setZIndexOffset(0);}
}
// 最寄りの1件（t=2以外）を琥珀色の点滅ピンにする
let nearId=null;
function markNearest(id){
  if(nearId===id) return;
  const prevId=nearId, prev=markers.get(prevId); nearId=id;
  if(prev) prev.setIcon(mkIcon(iconCls(prevId,prev)));
  const m=markers.get(id);
  if(m) m.setIcon(mkIcon(iconCls(id,m)));
}

map.on('click',e=>{
  if(addMode){ placePin(e.latlng.lat,e.latlng.lng); }
  else {
    stopWatch(true);
    setBase(e.latlng.lat,e.latlng.lng,'tap');
    toast('この地点を基準に並べ替えました（◎でGPSに戻る）');
  }
});

/* ---------- geo utils ---------- */
function dist(a,b){const R=6371,d=x=>x*Math.PI/180;
  const dl=d(b.lat-a.lat),dn=d(b.lng-a.lng);
  const h=Math.sin(dl/2)**2+Math.cos(d(a.lat))*Math.cos(d(b.lat))*Math.sin(dn/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));}
function fmt(km){
  if(km<1) return {v:Math.round(km*1000),u:'m'};
  if(km<10) return {v:km.toFixed(1),u:'km'};
  return {v:Math.round(km),u:'km'};
}
function bearingDeg(a,b){const d=x=>x*Math.PI/180,y=Math.sin(d(b.lng-a.lng))*Math.cos(d(b.lat));
  const x=Math.cos(d(a.lat))*Math.sin(d(b.lat))-Math.sin(d(a.lat))*Math.cos(d(b.lat))*Math.cos(d(b.lng-a.lng));
  return ((Math.atan2(y,x)*180/Math.PI)+360)%360;}
function bearingTxt(deg){return ['北','北東','東','南東','南','南西','西','北西'][Math.round(deg/45)%8];}
function band(d){
  if(d<=1) return '~ 1 km ・歩ける';
  if(d<=5) return '~ 5 km ・すぐ着く';
  if(d<=15) return '~ 15 km ・車で30分圏';
  if(d<=50) return '~ 50 km';
  return '50 km ~';
}

function toast(msg){const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2800);}

/* ---------- base / GPS ---------- */
const SRC_LABEL={gps:'GPS', tap:'地図で指定', restored:'前回の基準点'};
function setBase(lat,lng,src){
  base={lat,lng}; baseSrc=src;
  if(baseMarker) map.removeLayer(baseMarker);
  const cls=src==='gps'?'me':'base';
  baseMarker=L.marker([lat,lng],{icon:L.divIcon({className:'',html:`<div class="${cls}"></div>`,iconSize:[16,16],iconAnchor:[8,8]}),zIndexOffset:900}).addTo(map);
  document.getElementById('statusMain').textContent=
    src==='gps'?(watchId!=null?'現在地から近い順・追尾中':'現在地から近い順')
    :src==='restored'?'前回の基準点から近い順':'基準点から近い順';
  if(src!=='gps') document.getElementById('statusSrc').textContent=SRC_LABEL[src]||'';
  saveState(); render();
}
function setStatusGps(acc){
  document.getElementById('statusSrc').textContent='GPS ±'+Math.round(acc)+'m'+(watchId!=null?' ・追尾中':'');
}
function onFix(p){
  const lat=p.coords.latitude, lng=p.coords.longitude, acc=p.coords.accuracy||0;
  if(accCircle) map.removeLayer(accCircle);
  if(acc>15) accCircle=L.circle([lat,lng],{radius:acc,color:'#5ab7ff',weight:1,fillColor:'#5ab7ff',fillOpacity:.07,interactive:false}).addTo(map);
  const moved=!lastGps||dist(lastGps,{lat,lng})>0.03;   // 30m以上動いたときだけ再描画
  lastGps={lat,lng};
  if(!firstFix){firstFix=true; map.setView([lat,lng],Math.max(map.getZoom(),12));}
  if(moved) setBase(lat,lng,'gps');
  setStatusGps(acc);
}
function geoFail(){
  document.getElementById('statusMain').textContent='現在地を取得できません';
  document.getElementById('statusSrc').textContent='地図をタップで基準点指定';
  render();
}
function locateOnce(initial){
  const fab=document.getElementById('fab'); fab.classList.add('loading');
  if(!navigator.geolocation){fab.classList.remove('loading'); geoFail(); return;}
  const safety=setTimeout(()=>fab.classList.remove('loading'),20000);   // 許可ダイアログ放置でスピナーが回り続けない
  navigator.geolocation.getCurrentPosition(
    p=>{clearTimeout(safety); fab.classList.remove('loading'); firstFix=false; onFix(p);},
    e=>{clearTimeout(safety); fab.classList.remove('loading'); if(initial&&!base) geoFail();},
    {enableHighAccuracy:true,timeout:8000,maximumAge:60000});
}
function startWatch(){
  const fab=document.getElementById('fab');
  if(!navigator.geolocation){geoFail(); return;}
  fab.classList.add('loading');
  const safety=setTimeout(()=>fab.classList.remove('loading'),20000);
  firstFix=false; lastGps=null;
  watchId=navigator.geolocation.watchPosition(
    p=>{clearTimeout(safety); fab.classList.remove('loading'); fab.classList.add('on'); onFix(p);},
    e=>{clearTimeout(safety); fab.classList.remove('loading');
      // 一時的な取得失敗(code 2/3)では追尾を止めない。拒否(code 1)のみ停止
      if(e.code===1){ stopWatch(true); toast('位置情報が許可されていません'); }
    },
    {enableHighAccuracy:true,timeout:15000,maximumAge:5000});
}
function stopWatch(silent){
  const fab=document.getElementById('fab');
  if(watchId!=null){navigator.geolocation.clearWatch(watchId); watchId=null;}
  fab.classList.remove('on','loading');
  if(accCircle){map.removeLayer(accCircle); accCircle=null;}
  if(baseSrc==='gps'){document.getElementById('statusMain').textContent='現在地から近い順';
    const s=document.getElementById('statusSrc'); s.textContent=s.textContent.replace(' ・追尾中','');}
  if(!silent) toast('現在地の追尾を停止しました');
}
document.getElementById('fab').addEventListener('click',()=>{
  if(watchId!=null){ stopWatch(false); }
  else { startWatch(); toast('現在地を追尾します（もう一度押すと停止）'); }
});

function passFilter(s){

    if(!filters[f]) return true;

    if(f==='quiet') return s.q>=3;
    return !!s[f];

}

/* ---------- LIVE SEARCH ---------- */
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
async function overpassFetch(q){
  for(const ep of OVERPASS){
    // 1系統目は短めに切って早くフォールバックする
    const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(), ep===OVERPASS[0]?12000:20000);
    try{
      const res=await fetch(ep,{method:'POST',body:'data='+encodeURIComponent(q),signal:ctl.signal});
      clearTimeout(tm);
      if(!res.ok) throw new Error('http '+res.status);
      return await res.json();
    }catch(err){ clearTimeout(tm); }
  }
  return null;
}
// ライブ検索の品質ルール（SPEC 4.6）
// 名前・タグで明確に除外するもの（墓地・宗教施設・私有地など）
const BAD_NAME=/墓地|霊園|斎場|火葬|葬祭|葬儀|寺院|神社|仏閣|お墓|納骨/;
const badTag=t=>t.landuse==='cemetery'||t.amenity==='grave_yard'||t.amenity==='place_of_worship'
  ||t.amenity==='funeral_hall'||t.historic!=null||t.access==='private'||t.access==='no';
// 種別ホワイトリスト（該当しなければ候補にしない＝ゴミ除け）
function classify(t,nm){
  if(/道の駅/.test(nm)) return '道の駅';
  if(t.highway==='services') return 'SA・PA';
  if(t.highway==='rest_area') return '休憩所・PA';
  if(t.tourism==='caravan_site'||/ＲＶパーク|RVパーク/.test(nm)) return 'RVパーク';
  if(t.tourism==='camp_site'||/オートキャンプ|キャンプ場|野営場/.test(nm)) return 'キャンプ場';
  if(/車中泊/.test(nm)) return '車中泊スポット';
  return null;
}
async function liveSearch(){
  const btn=document.getElementById('liveMapBtn');
  const c=map.getCenter();
  // 検索半径は表示中の地図範囲から自動決定（3〜30km）
  const ne=map.getBounds().getNorthEast();
  const R=Math.round(Math.min(30, Math.max(3, dist({lat:c.lat,lng:c.lng},{lat:ne.lat,lng:ne.lng})))*1000);
  if(!base){ setBase(c.lat,c.lng,'tap'); toast('地図の中心を基準点にしました'); }
  else if(!loadJSON('carcamp_liveinfo_v1',false)){ saveJSON('carcamp_liveinfo_v1',true);
    toast('表示中の地図の範囲からOSMの候補を探します（設備・可否は未確認）'); }
  btn.disabled=true; btn.classList.add('on');
  const around=`(around:${R},${c.lat},${c.lng})`;
  // タグ検索は軽くて確実。名前の正規表現検索はOverpassに重く5xxになりやすいので、
  // 補助扱いにして失敗しても無視する
  const tagQ=`[out:json][timeout:25];(`
    +`nwr["tourism"="caravan_site"]${around};`
    +`nwr["tourism"="camp_site"]${around};`
    +`nwr["highway"="rest_area"]${around};`
    +`nwr["highway"="services"]${around};`
    +`);out center 120;`;
  const nameQ=`[out:json][timeout:25];(`
    +`nwr["name"~"道の駅"]${around};`
    +`nwr["name"~"ＲＶパーク|RVパーク|オートキャンプ|キャンプ場|野営場|車中泊"]${around};`
    +`);out center 120;`;
  const [tagJ,nameJ]=await Promise.all([overpassFetch(tagQ),overpassFetch(nameQ)]);
  btn.disabled=false; btn.classList.remove('on');
  if(!tagJ&&!nameJ){ toast('ライブ検索に失敗しました（検索サーバー混雑）。時間をおいて再試行してください'); return; }
  const seen=new Set();
  const known=SPOTS.concat(MY).map(s=>({lat:s.lat,lng:s.lng}));
  LIVE=[]; let dropped=0;
  const elements=(tagJ?tagJ.elements:[]).concat(nameJ?nameJ.elements:[]);
  for(const el of elements){
    const lat=el.lat??el.center?.lat, lng=el.lon??el.center?.lon; if(lat==null||lng==null) continue;
    const t=el.tags||{}; const nm=(t.name||t['name:ja'])||'';
    if(!nm) continue;                                          // 名前なしは判断できないので除外
    if(BAD_NAME.test(nm)||badTag(t)){ dropped++; continue; }   // 墓地・宗教施設・私有地を除外
    const cat=classify(t,nm); if(!cat){ dropped++; continue; } // 種別ホワイトリストに該当しないものは採用しない
    const key=nm+Math.round(lat*1000)+Math.round(lng*1000); if(seen.has(key)) continue; seen.add(key);
    if(known.some(k=>dist(k,{lat,lng})<0.18)) continue;
    LIVE.push({n:nm,cat,area:'',lat,lng,t:2,m:''});
  }
  liveTs=Date.now(); liveRestored=false;
  if(LIVE.length) saveJSON(LVKEY,{ts:liveTs,results:LIVE});   // 0件で前回キャッシュを潰さない
  toast(LIVE.length?`OSMから ${LIVE.length}件の候補（紫のピン・未確認）${dropped?`／対象外 ${dropped}件は自動で除外`:''}`:'この範囲では新しい候補が見つかりませんでした');
  drawLive(); render();
}
document.getElementById('liveMapBtn').addEventListener('click',liveSearch);
// 前回のライブ検索結果を復元（オフラインでも直近の候補が見える）。24時間で失効
(function(){
  const cache=loadJSON(LVKEY,null);
  if(!(cache&&Array.isArray(cache.results)&&cache.results.length)) return;
  if(Date.now()-cache.ts>86400000){ try{localStorage.removeItem(LVKEY)}catch(e){} return; }
  LIVE=cache.results; liveTs=cache.ts; liveRestored=true; drawLive();
})();

/* ---------- RENDER ---------- */
function allSpots(){ return SPOTS.map((s,i)=>({s,id:'s'+i}))
  .concat(MY.map(s=>({s,id:'m'+s.id})))
  .concat(LIVE.map((s,i)=>({s,id:'l'+i}))); }

function syncMap(visible){
  markers.forEach((m,id)=>{
    if(visible.has(id)){ if(!map.hasLayer(m)) m.addTo(map); }
    else { if(map.hasLayer(m)) map.removeLayer(m); }
  });
}

function cardHTML(s,id,d){
  let distCol='';
  if(d!=null){
    const f=fmt(d), deg=bearingDeg(base,s);
    distCol=`<div class="dist"><span class="v">${f.v}</span><span class="u">${f.u}</span>
      <span class="u dir"><span class="arw" style="transform:rotate(${Math.round(deg)}deg)">↑</span>${bearingTxt(deg)}</span></div>`;
  }
  if(s.t===2){ return `<button class="card live" data-id="${id}">${distCol}
    <div class="body"><div class="name">${esc(s.n)}</div>
      <div class="meta"><span>${esc(s.cat)}</span><span class="tag live">OSM候補</span></div>
      <div class="livemeta">地図データから自動取得。設備・車中泊可否は未確認です。</div></div></button>`; }
  const amen=['wc','h24','free','onsen'].map(k=>`<span class="i ${s[k]?'on':''}">${IC[k]}</span>`).join('');
  const dots=[1,2,3].map(n=>`<span class="dot ${n<=s.q?'f':''}"></span>`).join('');
  const tag=s.chk?'<span class="tag chk">要確認</span>':(s.t===3?'<span class="tag my">自分の</span>':(s.t===1?'<span class="tag cand">候補</span>':''));
  const cls=s.t===3?'card my':'card';
  return `<button class="${cls}" data-id="${id}">${distCol}
    <div class="body"><div class="name">${esc(s.n)}</div>
      <div class="meta"><span>${esc(s.cat)}</span>${s.area?'<span>·</span><span>'+esc(s.area)+'</span>':''}${tag}</div>
      <div class="amen">${amen}<span class="quiet">静けさ<span class="dots">${dots}</span></span></div></div></button>`;
}

function render(){
  const list=document.getElementById('list');
  const st=list.scrollTop;
  const anyFilter=Object.values(filters).some(v=>v);
  let rows=allSpots().filter(({s})=>passFilter(s));
  syncMap(new Set(rows.map(r=>r.id)));

  const foot=`<div class="myfoot">自分の追加 <b>${MY.length}</b>件 · <button class="linkbtn" id="dataBtn">書き出し / 読み込み</button></div>`;
  let notice='';
  if(anyFilter&&LIVE.length) notice+=`<div class="notice">OSM候補 ${LIVE.length}件は設備が未確認のため、フィルター中は表示していません。</div>`;
  else if(liveRestored&&LIVE.length&&liveTs){
    const min=Math.round((Date.now()-liveTs)/60000);
    const age=min<1?'たった今':min<60?min+'分前':Math.round(min/60)+'時間前';
    notice+=`<div class="notice">前回のライブ検索結果 ${LIVE.length}件を表示中（${age}）。「このあたりを検索」で更新できます。</div>`;
  }

  if(!base){ markNearest(null);
    list.innerHTML=`<div class="hint">右下の<b> ◎ </b>で現在地を取得できます。<br>取れないときは<b>地図をタップ</b>すると、その地点から近い順に並びます。<br><br>釣り場に立ったまま開けば、そこから一番近い泊まり場が上に出ます。</div>`+foot;
    document.getElementById('dataBtn').onclick=openData; return; }
  if(!rows.length){ markNearest(null);
    list.innerHTML=notice+`<div class="hint">条件に合う場所がありません。<br>フィルターを外してみてください。</div>`+foot;
    document.getElementById('dataBtn').onclick=openData; return; }

  rows.forEach(r=>r.d=dist(base,r.s)); rows.sort((a,b)=>a.d-b.d);
  markNearest((rows.find(r=>r.s.t!==2)||{}).id||null);
  let html=notice, lastBand=null;
  rows.forEach(({s,id,d})=>{
    const b=band(d);
    if(b!==lastBand){ html+=`<div class="bandhead">${b}</div>`; lastBand=b; }
    html+=cardHTML(s,id,d);
  });
  list.innerHTML=html+foot;
  list.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>openSheet(c.dataset.id)));
  document.getElementById('dataBtn').onclick=openData;
  list.scrollTop=st;
}

/* ---------- DETAIL ---------- */
const scrim=document.getElementById('scrim'), sheet=document.getElementById('sheet');
let lastFocus=null;
function openSheetEl(el){
  lastFocus=document.activeElement;
  scrim.classList.add('open'); el.classList.add('open');
  const c=el.querySelector('.s-close'); if(c) c.focus();
}
function restoreFocus(){ if(lastFocus&&lastFocus.focus){try{lastFocus.focus()}catch(e){}} lastFocus=null; }
function getSpot(id){ if(id[0]==='s') return SPOTS[+id.slice(1)]; if(id[0]==='l') return LIVE[+id.slice(1)]; return MY.find(x=>x.id===id.slice(1)); }
function openSheet(id){
  const s=getSpot(id); if(!s) return;
  selectMarker(id);
  const dhtml= base ? (()=>{const f=fmt(dist(base,s)); return `<span class="v">${f.v}</span><span class="u">${f.u}</span><span class="sep">/</span><span class="cat">${bearingTxt(bearingDeg(base,s))}の方向</span>`;})()
    : `<span class="cat">距離は現在地取得後に表示</span>`;
  let mid='';
  if(s.t===2){
    mid=`<div class="meta" style="margin-top:2px">${esc(s.cat)} <span class="tag live">OSM候補</span></div>
      <div class="note live">地図データ(OpenStreetMap)から自動で拾った候補です。トイレ・料金・車中泊の可否は未確認。現地の看板やGoogleの口コミで必ず確認してください。</div>`;
  }else{
    const amen=[['wc','夜も使えるトイレ','トイレなし'],['h24','24時間 出入り可',''],['free','駐車 無料','駐車 有料/要確認'],['onsen','温泉が近い','']]
      .map(([k,on,off])=>`<div class="i ${s[k]?'on':''}">${IC[k]}<span>${s[k]?on:(off||LABELS[k]+'なし')}</span></div>`).join('');
    const dots=[1,2,3].map(n=>`<span class="dot ${n<=s.q?'f':''}"></span>`).join('');
    const qtxt=['—','夜は少し騒がしめ','ふつう','とても静か'][s.q]||'—';
    const note = s.chk?`<div class="note warn">本来は車中泊向けの場所ではない、または予約・確認が要る場所です。可否は現地の看板や施設に確認を。夜は静かに、長時間の滞在は控えめに。</div>`
      : (s.t===3?`<div class="note cand" style="background:var(--mine-dim);border-color:#2f5a3e;color:#bff0cb">自分で追加したスポットです。編集・削除できます。</div>`
      : (s.t===1?`<div class="note cand">自動で追加した候補です。設備は口コミ情報からの推定なので、現地で確認してください。</div>`:''));
    mid=`<div class="meta" style="margin-top:2px">${esc(s.cat)}${s.area?' · '+esc(s.area):''}${s.chk?' <span class="tag chk">要確認</span>':''}</div>
      ${note}<div class="s-amen">${amen}</div>
      <div class="s-quiet">静けさ <span class="dots">${dots}</span> <span style="color:var(--muted)">${qtxt}</span></div>
      ${s.m?`<div class="memo">${esc(s.m)}</div>`:''}`;
  }
  const dirUrl=`https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}`;
  const viewUrl=(s.n&&s.n!=='(名称なし)')?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.n+' '+(s.area||''))}`:`https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`;
  const editRow = s.t===3 ? `<div class="actions" style="margin-top:10px">
      <button class="btn sm edit" id="sEdit">編集</button>
      <button class="btn sm del" id="sDel">削除</button></div>` : '';
  document.getElementById('sheetBody').innerHTML=`
    <div class="s-top"><div class="s-name">${esc(s.n)}</div><button class="s-close" id="sClose" aria-label="閉じる">×</button></div>
    <div class="s-dist">${dhtml}</div>${mid}
    <div class="actions">
      <a class="btn go" href="${dirUrl}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>経路案内</a>
      <a class="btn map" href="${viewUrl}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/></svg>地図で見る</a>
    </div>${editRow}`;
  openSheetEl(sheet);
  document.getElementById('sClose').onclick=closeSheet;
  if(s.t===3){
    document.getElementById('sEdit').onclick=()=>{ closeSheet(); startEdit(s); };
    document.getElementById('sDel').onclick=()=>deleteSpot(s);
  }
}
function closeSheet(){ sheet.classList.remove('open'); closeScrimIfIdle(); clearSel(); restoreFocus(); }
function closeScrimIfIdle(){
  const anyOpen=['sheet','formSheet','dataSheet'].some(id=>document.getElementById(id).classList.contains('open'));
  if(!anyOpen) scrim.classList.remove('open');
}
function closeTopmost(){
  const form=document.getElementById('formSheet');
  if(form.classList.contains('open')){ cancelForm(); return; }
  if(sheet.classList.contains('open')){ closeSheet(); return; }
  const data=document.getElementById('dataSheet');
  if(data.classList.contains('open')){ closeData(); return; }
  if(addMode) exitAdd();
}
scrim.addEventListener('click',closeTopmost);
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeTopmost();});

/* 下スワイプでシートを閉じる */
function enableSwipe(el, closeFn){
  let sy=null, dy=0, drag=false;
  const reset=()=>{el.style.transition=''; el.style.transform='';};
  el.addEventListener('touchstart',e=>{
    if(el.scrollTop>4) return;
    sy=e.touches[0].clientY; dy=0; drag=true; el.style.transition='none';
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(!drag) return;
    if(el.scrollTop>0){ drag=false; reset(); return; }   // 中身のスクロールに切り替わったら追従をやめる
    dy=e.touches[0].clientY-sy;
    el.style.transform = dy>0 ? `translateY(${dy}px)` : '';
  },{passive:true});
  el.addEventListener('touchend',()=>{
    if(!drag) return; drag=false; reset();
    if(dy>90) closeFn();
  });
  el.addEventListener('touchcancel',()=>{ if(drag){drag=false; reset();} });
}
enableSwipe(sheet, closeSheet);
enableSwipe(document.getElementById('formSheet'), cancelForm);
enableSwipe(document.getElementById('dataSheet'), closeData);

/* ---------- boot ---------- */
if(ST.base&&ST.base.lat!=null){ setBase(ST.base.lat, ST.base.lng, 'restored'); map.setView([ST.base.lat,ST.base.lng],10); }
updateChipCounts(); render(); locateOnce(true);
</script>
